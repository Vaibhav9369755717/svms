services:
  - type: web
    name: svms
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_PATH
        value: /var/data/svams.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disks:
      - name: svms-data
        mountPath: /var/data
        sizeGB: 1

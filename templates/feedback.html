{% extends 'base.html' %}

{% block content %}
<section class="page-hero py-5">
  <div class="container py-5">
    <h1 class="display-5 fw-bold">Feedback</h1>
    <p class="lead text-muted">Share your experience and help us improve.</p>
  </div>
</section>
<section class="py-5">
  <div class="container">
    <div class="card shadow-sm p-4">
      <form method="post">
        <div class="mb-3"><label class="form-label">Rating</label><select class="form-select" name="rating"><option value="5">5 Star</option><option value="4">4 Star</option><option value="3">3 Star</option></select></div>
        <div class="mb-3"><label class="form-label">Your Message</label><textarea class="form-control" name="message" rows="5" required></textarea></div>
        <button class="btn btn-primary">Submit Feedback</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}

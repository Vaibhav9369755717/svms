{% extends 'base.html' %}

{% block content %}
<section class="page-hero py-5">
  <div class="container py-5">
    <h1 class="display-5 fw-bold">Profile</h1>
    <p class="lead text-muted">Update your personal and vehicle information.</p>
  </div>
</section>
<section class="py-5">
  <div class="container">
    <div class="card shadow-sm p-4">
      <form method="post">
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">Full Name</label><input class="form-control" name="full_name" value="{{ user.full_name }}" required></div>
          <div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ user.phone or '' }}"></div>
          <div class="col-12"><label class="form-label">Address</label><textarea class="form-control" name="address" rows="3">{{ user.address or '' }}</textarea></div>
          <div class="col-12"><button class="btn btn-primary">Save Profile</button></div>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}

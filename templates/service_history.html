{% extends 'base.html' %}

{% block content %}
<section class="page-hero py-5">
  <div class="container py-5">
    <h1 class="display-5 fw-bold">Service History</h1>
    <p class="lead text-muted">Review all past bookings and completed services.</p>
  </div>
</section>
<section class="py-5">
  <div class="container">
    <div class="card shadow-sm p-4">
      <table class="table table-striped">
        <thead>
          <tr><th>Booking #</th><th>Service</th><th>Date</th><th>Status</th></tr>
        </thead>
        <tbody>
          {% for booking in bookings %}
            <tr><td>#{{ booking.id }}</td><td>{{ booking.service_name }}</td><td>{{ booking.booking_date }}</td><td>{{ booking.status }}</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</section>
{% endblock %}
